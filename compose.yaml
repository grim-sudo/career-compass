name: career-compass
services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file: backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: postgresql://career:${POSTGRES_PASSWORD:?Run npm run setup:local first}@db:5432/career_compass
      FRONTEND_ORIGIN: http://localhost:${APP_PORT:-3000},http://127.0.0.1:${APP_PORT:-3000}
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_compass
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career_compass"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
